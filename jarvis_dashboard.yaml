# Example Dashboard — Tapo RV30
#
# ⚠️  ENTITY IDs ARE SPECIFIC TO THIS EXAMPLE
#   All entity IDs below come from a vacuum named "Jedáleň" on floor 0.
#   Replace every occurrence with your own vacuum's name/floor
#   (lowercase, spaces replaced with underscores).
#   e.g. if your vacuum is named "Hoover" on "Podlazie 1":
#     vacuum.jedalen_rv30_max                  → vacuum.hoover_rv30_max
#     camera.jedalen_rv30_max_map              → camera.hoover_rv30_max_map
#     sensor.jedalen_rv30_max_*                → sensor.hoover_rv30_max_*
#     sensor.podlazie_0_rv30_max_*             → sensor.podlazie_1_rv30_max_*
#     binary_sensor.podlazie_0_rv30_max_*      → binary_sensor.podlazie_1_rv30_max_*
#     input_button.kod_20                      → your own "error code" helper, if used
#
# Requires the HACS frontend card:
#   - card-mod (https://github.com/thomasloven/lovelace-card-mod)
#     (only used to rotate the map camera image 180°; drop the card_mod
#     block on the picture-entity card if you don't need that)
#
# This is a single dashboard view (HA's new "sections" view type). Add it as
# a new view: Settings → Dashboards → your dashboard → Edit → Add View →
# switch to YAML mode and paste this in.

type: sections
max_columns: 4
title: RV30 Max
path: rv30-max
icon: mdi:robot-vacuum
show_icon_and_title: false
subview: true
sections:
  - type: grid
    cards:
      - type: tile
        entity: vacuum.jedalen_rv30_max
        state_content: state
        vertical: false
        features:
          - type: vacuum-commands
            commands:
              - start_pause
              - stop
              - return_home
              - clean_spot
        features_position: inline
      - type: tile
        grid_options:
          columns: 12
          rows: 1
        entity: sensor.podlazie_0_rv30_max_clean_progress
        name:
          type: entity
        state_content: state
        vertical: false
        features:
          - type: bar-gauge
        features_position: inline
      - type: tile
        grid_options:
          columns: 12
          rows: 1
        entity: sensor.jedalen_rv30_max_battery
        name:
          type: entity
        state_content: state
        vertical: false
        features:
          - type: bar-gauge
        features_position: inline
      - type: tile
        grid_options:
          columns: 12
          rows: 1
        entity: binary_sensor.podlazie_0_rv30_max_mop_attached
        name:
          type: entity
        state_content: state
        vertical: false
        features:
          - type: bar-gauge
        features_position: inline
      - type: tile
        grid_options:
          columns: 12
          rows: 1
        entity: sensor.jedalen_rv30_max_error
        name:
          type: entity
        state_content: state
        vertical: false
        features:
          - type: bar-gauge
        features_position: inline
        visibility:
          - condition: state
            state_not: Ok
      - type: tile
        entity: input_button.kod_20
        name: 20 – Chyba vysávača
        icon: mdi:robot-vacuum-alert
        color: blue-grey
        features:
          - type: button
        features_position: inline
      - show_state: false
        show_name: false
        camera_view: auto
        fit_mode: cover
        type: picture-entity
        entity: camera.jedalen_rv30_max_map
        camera_image: camera.jedalen_rv30_max_map
        show_entity_picture: false
        card_mod:
          style: |
            ha-card {
              transform: rotate(180deg);
              transition: none !important;
            }
    column_span: 1
