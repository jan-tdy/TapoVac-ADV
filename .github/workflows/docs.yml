name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # The "pages" concurrency group above only queues whole *workflow runs*, not Pages
      # deployments. When the previous run's deployment is still being torn down (or just
      # got cancelled) at the moment this one starts, the Pages API can reject this one
      # with "due to in progress deployment" even though nothing here raced on our side.
      # That clears within seconds, so one short-delay retry is enough.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait for the previous deployment to finish clearing
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
